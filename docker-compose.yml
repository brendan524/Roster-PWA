# AB Group staff app (roster PWA) — runs behind the existing Traefik on the VPS.
#
#   cp .env.example .env        # fill in from Passbolt
#   mkdir -p secrets && cp <key>.json secrets/google-service-account.json
#   docker compose up -d --build
#
# The app joins the shared `n8n_default` network so Traefik can route to it.
# The database sits on a private internal network and is never exposed.

services:
  roster-app:
    build: .
    image: ab-roster-app:latest
    restart: unless-stopped
    depends_on:
      roster-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://roster:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@roster-db:5432/roster
      PIN_PEPPER: ${PIN_PEPPER:?set PIN_PEPPER in .env}
      PIN_LENGTH: ${PIN_LENGTH:-6}
      LATE_GRACE_MINUTES: ${LATE_GRACE_MINUTES:-10}
      EARLY_GRACE_MINUTES: ${EARLY_GRACE_MINUTES:-10}
      KIOSK_LOCATIONS: ${KIOSK_LOCATIONS:-AB HQ:onshore,WrkPod:offshore}
      BACKUP_DRIVE_FOLDER_ID: ${BACKUP_DRIVE_FOLDER_ID:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_REDIRECT_URI: https://${APP_DOMAIN}/api/admin/xero/callback
      APP_URL: https://${APP_DOMAIN}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      PAY_REPORT_EMAIL: ${PAY_REPORT_EMAIL:-}
      AVAILABILITY_EMAIL: ${AVAILABILITY_EMAIL:-}
      DIGEST_EMAIL: ${DIGEST_EMAIL:-}
      EXPENSE_APPROVERS: ${EXPENSE_APPROVERS:-AB0001}
      LEAVE_ON_BEHALF_APPROVERS: ${LEAVE_ON_BEHALF_APPROVERS:-AB0001}
      DIGEST_DAYS: ${DIGEST_DAYS:-mon-fri}
      OFFICE_ADDRESS: ${OFFICE_ADDRESS:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GRAND_FINAL_FRIDAYS: ${GRAND_FINAL_FRIDAYS:-2026-09-25}
      EXTRA_PUBLIC_HOLIDAYS: ${EXTRA_PUBLIC_HOLIDAYS:-}
      TIMEZONE: ${TIMEZONE:-Australia/Melbourne}
      ROSTER_SOURCE: google
      ROSTER_SHEET_ID: ${ROSTER_SHEET_ID:?set ROSTER_SHEET_ID in .env}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      COOKIE_SECURE: "true"
    volumes:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    networks:
      - n8n_default
      - roster_internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.ab-roster.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)
      - traefik.http.routers.ab-roster.entrypoints=websecure
      - traefik.http.routers.ab-roster.tls=true
      - traefik.http.routers.ab-roster.tls.certresolver=mytlschallenge
      - traefik.http.services.ab-roster.loadbalancer.server.port=8000
      - traefik.http.middlewares.ab-roster-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.ab-roster-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.ab-roster.middlewares=ab-roster-hsts

  roster-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roster
      POSTGRES_DB: roster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - roster_pgdata:/var/lib/postgresql/data
    networks:
      - roster_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  roster_pgdata:

networks:
  n8n_default:
    external: true
  roster_internal:
    internal: true
